<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111">
<title>Studio Nivedita Trace</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div><div class="eyebrow">STUDIO NIVEDITA</div><h1>TRACE</h1></div>
  <button id="startBtn" class="primary">Start camera</button>
</header>
<main>
  <section id="setup" class="panel">
    <h2>1. Choose your reference</h2>
    <label class="upload"><input id="imageInput" type="file" accept="image/*"><span>＋ Upload reference</span></label>
    <p class="hint">Then put the phone over the whole canvas. We’ll lock the artwork to the physical canvas.</p>
  </section>
  <section id="stage" class="stage hidden">
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="overlayCanvas"></canvas>
    <canvas id="calibrationCanvas"></canvas>
    <div id="canvasLock" class="canvas-lock hidden">🔒 CANVAS LOCKED</div>
    <div id="trackingStatus" class="tracking-status hidden">Tracking canvas…</div>
    <div class="stageHint" id="stageHint">Tap the 4 canvas corners, clockwise</div>
  </section>
  <section class="controls panel">
    <div class="control"><label>Reference opacity <output id="opacityOut">55%</output></label><input id="opacity" type="range" min="0" max="100" value="55"></div>
    <div class="buttons">
      <button id="lockBtn" disabled>📐 Lock canvas</button>
      <button id="unlockBtn" class="hidden">🔓 Unlock</button>
      <button id="gridBtn">▦ Grid</button>
      <button id="resetBtn">↺ Reset</button>
    </div>
    <p id="status" class="status">Upload a reference, start the camera, then calibrate the canvas.</p>
  </section>
</main>
<script async src="https://docs.opencv.org/4.x/opencv.js" onload="window.openCvLoaded=true"></script>
<script src="app.js"></script>
</body>
</html>
